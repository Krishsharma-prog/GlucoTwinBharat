<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1320"/><stop offset="1" stop-color="#101f30"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64d8c4"/></marker></defs><rect width="1200" height="700" rx="28" fill="url(#bg)"/><text x="60" y="65" fill="#69deca" font-family="Arial" font-size="16" letter-spacing="3">GLUCOTWIN BHARAT · SYSTEM ARCHITECTURE</text><text x="60" y="108" fill="#f1f6ff" font-family="Arial" font-size="29" font-weight="bold">Two data streams → updated twin → forecasting</text><g font-family="Arial" text-anchor="middle"><rect x="60" y="170" width="280" height="115" rx="15" fill="#16273a" stroke="#3a526c"/><text x="200" y="207" font-size="19" fill="#eaf2fc" font-weight="bold">Historical EHR</text><text x="200" y="236" font-size="14" fill="#90a8c1">patients.json</text><text x="200" y="259" font-size="13" fill="#6bdac6">Demographics · labs · diagnoses</text><rect x="60" y="350" width="280" height="125" rx="15" fill="#16273a" stroke="#3a526c"/><text x="200" y="390" font-size="19" fill="#eaf2fc" font-weight="bold">Dynamic sensor stream</text><text x="200" y="419" font-size="14" fill="#90a8c1">observations.csv + simulator</text><text x="200" y="445" font-size="13" fill="#6bdac6">Glucose · meals · steps · sleep</text><rect x="430" y="254" width="290" height="145" rx="16" fill="#183a39" stroke="#4dc9b5" stroke-width="2"/><text x="575" y="294" font-size="20" fill="#edfffb" font-weight="bold">Twin state builder</text><text x="575" y="324" font-size="14" fill="#b1d9d2">Patient-specific features</text><text x="575" y="348" font-size="14" fill="#b1d9d2">Current state + recent trends</text><text x="575" y="375" font-size="12" fill="#69deca">FastAPI service</text><rect x="815" y="160" width="320" height="130" rx="15" fill="#292747" stroke="#9184e5"/><text x="975" y="197" font-size="19" fill="#f3f0ff" font-weight="bold">Forecasting engine</text><text x="975" y="226" font-size="14" fill="#c1b8ff">4 Random Forest models</text><text x="975" y="251" font-size="13" fill="#a9a2d9">15 / 30 / 60 / 120 minutes</text><rect x="815" y="365" width="320" height="125" rx="15" fill="#3a2b1d" stroke="#d59b58"/><text x="975" y="400" font-size="19" fill="#fff3df" font-weight="bold">Clinician-facing UI</text><text x="975" y="428" font-size="14" fill="#dfc09a">React · Recharts</text><text x="975" y="454" font-size="13" fill="#e9b778">Trajectory · alert signal · what-if</text><path d="M340 227 L430 287" stroke="#64d8c4" stroke-width="3" marker-end="url(#arr)" fill="none"/><path d="M340 411 L430 365" stroke="#64d8c4" stroke-width="3" marker-end="url(#arr)" fill="none"/><path d="M720 292 L815 227" stroke="#64d8c4" stroke-width="3" marker-end="url(#arr)" fill="none"/><path d="M975 290 L975 365" stroke="#64d8c4" stroke-width="3" marker-end="url(#arr)" fill="none"/><path d="M815 430 Q765 430 765 385 L720 365" stroke="#64d8c4" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arr)" fill="none"/><text x="600" y="555" font-family="Arial" fill="#8fa4bd" font-size="14" text-anchor="middle">Counterfactual scenarios re-run the same forecasting pipeline with altered inputs.</text><rect x="245" y="595" width="710" height="52" rx="12" fill="#281f1e" stroke="#73503a"/><text x="600" y="626" font-family="Arial" font-size="14" font-weight="bold" fill="#f1c193" text-anchor="middle">Synthetic data only · research proof-of-concept · not for clinical decisions</text></g></svg>
